<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- TAREA PARA EL ALUMNO:
                 Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
                 Debe contener campos para:
                 - Nombre completo (texto)
                 - Correo electrónico (email)
                 - Contraseña (password)
                 - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
                 - Género (radio buttons: Femenino, Masculino, Otro)
                 - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
                 - Fecha de nacimiento (date)
                 - Aceptar términos y condiciones (checkbox)
                 - Comentarios adicionales o gustos (textarea)
            -->
            <form class="auth-form" method="post" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">

                <h1> Crear Cuenta </h1>

                <div>
                    <lable for="nombre"> Nombre Completo: </lable>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="ej. Emily Lara"
                        required
                        minlength="3"
                        maxlength="80"
                    >
                </div>

                <div>
                    <label for="correo"> Correo electrónico: </label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="emy@gmail.com"
                        required
                        maxlength="100"
                    >
                </div>

                <div>
                    <label for="contrasenia"> Contraseña: </label>
                    <input
                        type="password"
                        id="contrasenia"
                        name="contrasenia"
                        placeholder="Minimo 8 caracteres"
                        required
                        minlength="8"
                        autocomplete="off"
                    >
                </div>

                <div>
                    <label for="pseudonimo"> Pseudonimo: </label>
                    <input
                        type="text"
                        id="pseudonimo"
                        name="pseudonimo"
                        required
                        pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                        placeholder="Nebula-2025"
                        minlength="6"
                        maxlength="20"
                    >
                </div>

                <div>
                    <label> Genero: </label>
                    <input
                        type="radio"
                        id="rad_femenino"
                        name="genero"
                        value="femenino"
                        required
                    >
                    <label for="rad_femenino"> Femenino </label>
                    <input
                        type="radio"
                        id="rad_masculino"
                        name="genero"
                        value="masculino"
                    >
                    <label for="rad_masculino"> Masculino </label>
                    <input
                        type="radio"
                        id="rad_otro"
                        name="genero"
                        value="otro"
                    >
                    <label for="rad_otro"> Otro </label>
                    <!-- Si los radio comparten name, es que pertenecen al mismo conjunto de selección -->
                </div>

                <div>
                    <label for="suscripcion"> Tipo de Suscripción</label>
                    <select id="suscripcion" name="suscripcion" required>
                        <option value=""> ---- Seleccione una opcion ---- </option>
                        <option value="gratis"> Gratis (Con anuncios) </option>
                        <option value="premium_mensual"> Premium Mensual ($99/mes)</option>
                        <option value="premiun_anual"> Premium anual ($899/año) </option>
                    </select>
                </div>

                <div>
                    <label for="fechaNacimiento"> Fecha de Nacimiento </label>
                    <input
                        type="date"
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                        required
                    >
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="terminos"
                        value="acepto"
                        required
                    >
                    <label for="terminos"> Acepto los Términos y Condiciones de Uso </label>
                </div>

                <div>
                    <label for="comentarios"> Comentarios o Gustos </label>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="30" placeholder="Cuentanos que música te gusta :3">

                    </textarea>
                </div>

                <div>
                    <button type="submit">
                        Crear cuenta
                    </button>
                    <button type="reset">
                        Limpiar Formulario
                    </button>
                </div>

            </form>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
